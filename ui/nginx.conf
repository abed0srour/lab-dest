# The API goes to the load balancer (which spreads it over the gateways). "resolve" re-reads its
# address from Docker's DNS, so a restarted load balancer is found again.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api 64k;
    server lb:80 resolve;
    keepalive 16;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads and downloads are streamed straight through (no buffering, no size limit).
    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The React app (single page: every other path serves index.html).
    location / {
        try_files $uri /index.html;
    }
}
