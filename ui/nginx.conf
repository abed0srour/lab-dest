server {
    listen 80;
    root /usr/share/nginx/html;

    # The API: forwarded to the gateway. Uploads and downloads are streamed straight through
    # (no buffering, no size limit), like the gateway streams them into the cluster.
    location /api/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The React app (single page: every other path serves index.html).
    location / {
        try_files $uri /index.html;
    }
}
