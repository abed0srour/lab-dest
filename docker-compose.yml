x-storage-node: &storage-node
  build: { context: ., dockerfile: storage_node/Dockerfile }
  image: dos/storage-node:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
    interval: 10s
    timeout: 3s
    retries: 3

x-node-env: &node-env
  METADATA_URL: http://metadata:8000
  HEARTBEAT_INTERVAL: "5"

# Redundancy settings, shared by the metadata service and the repair workers.
x-redundancy: &redundancy
  REPLICAS: "3"          # N: copies of every chunk in replicated buckets
  WRITE_QUORUM: "2"      # W: copies that must be stored before an upload succeeds
  READ_QUORUM: "2"       # R: replicas asked on every read (W + R > N)
  EC_K: "4"              # erasure-coded buckets: 4 data fragments ...
  EC_M: "2"              # ... + 2 parity fragments, any 4 of the 6 rebuild the chunk
  EC_WRITE_QUORUM: "5"   # fragments that must be stored before an upload succeeds
  RING_VNODES: "128"     # virtual nodes per storage node on the hash ring

# Both PostgreSQL nodes, in order: libpq connects to whichever one is the primary right now.
x-database: &database
  DATABASE_URL: "postgresql://dos:dos@pg-1:5432,pg-2:5432/dos?target_session_attrs=read-write&connect_timeout=2"

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  entrypoint: ["sh", "/usr/local/bin/ha-entrypoint.sh"]
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "dos", "-d", "dos"]
    interval: 5s
    timeout: 3s
    retries: 20

x-postgres-env: &postgres-env
  POSTGRES_USER: dos
  POSTGRES_PASSWORD: dos
  POSTGRES_DB: dos

x-gateway: &gateway
  build: { context: ., dockerfile: gateway/Dockerfile }
  image: dos/gateway:latest
  restart: unless-stopped
  depends_on:
    metadata: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 3

x-gateway-env: &gateway-env
  METADATA_URL: http://metadata:8000
  # key:user:requests per second (burst = 2 seconds' worth), enforced by each gateway. The demo key
  # is slow on purpose, to show the rate limit; the bench key is for the workload benchmark.
  API_KEYS: "student-key-2026:student:200,demo-key-2026:demo:5,bench-key-2026:bench:5000"

services:
  # ---- storage --------------------------------------------------------------------------------
  # 7 storage nodes: 6 for the 4 + 2 fragments of a chunk, plus one spare so a lost
  # fragment can be rebuilt on a node that does not already hold one of the others.
  storage-node-1:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-1, NODE_PUBLIC_URL: "http://127.0.0.1:8001" }
    volumes: [node1-data:/data]
    ports: ["8001:8000"]

  storage-node-2:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-2, NODE_PUBLIC_URL: "http://127.0.0.1:8002" }
    volumes: [node2-data:/data]
    ports: ["8002:8000"]

  storage-node-3:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-3, NODE_PUBLIC_URL: "http://127.0.0.1:8003" }
    volumes: [node3-data:/data]
    ports: ["8003:8000"]

  storage-node-4:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-4, NODE_PUBLIC_URL: "http://127.0.0.1:8004" }
    volumes: [node4-data:/data]
    ports: ["8004:8000"]

  storage-node-5:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-5, NODE_PUBLIC_URL: "http://127.0.0.1:8005" }
    volumes: [node5-data:/data]
    ports: ["8005:8000"]

  storage-node-6:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-6, NODE_PUBLIC_URL: "http://127.0.0.1:8006" }
    volumes: [node6-data:/data]
    ports: ["8006:8000"]

  storage-node-7:
    <<: *storage-node
    environment: { <<: *node-env, NODE_ID: storage-node-7, NODE_PUBLIC_URL: "http://127.0.0.1:8007" }
    volumes: [node7-data:/data]
    ports: ["8007:8000"]

  # An extra node to show rebalancing; not started by default:
  #   docker compose --profile extra-node up -d storage-node-8
  storage-node-8:
    <<: *storage-node
    profiles: [extra-node]
    environment: { <<: *node-env, NODE_ID: storage-node-8, NODE_PUBLIC_URL: "http://127.0.0.1:8008" }
    volumes: [node8-data:/data]
    ports: ["8008:8000"]

  # ---- metadata store: PostgreSQL primary + standby with automatic failover -------------------
  pg-1:
    <<: *postgres
    hostname: pg-1
    environment: { <<: *postgres-env, PEER: pg-2, INITIAL_ROLE: primary }
    volumes:
      - pg-1-data:/var/lib/postgresql/data
      - ./deploy/postgres/ha-entrypoint.sh:/usr/local/bin/ha-entrypoint.sh:ro
      - ./deploy/postgres/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro

  pg-2:
    <<: *postgres
    hostname: pg-2
    environment: { <<: *postgres-env, PEER: pg-1, INITIAL_ROLE: standby }
    volumes:
      - pg-2-data:/var/lib/postgresql/data
      - ./deploy/postgres/ha-entrypoint.sh:/usr/local/bin/ha-entrypoint.sh:ro
      - ./deploy/postgres/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    depends_on:
      pg-1: { condition: service_healthy }

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    restart: unless-stopped
    environment:
      discovery.type: single-node                 # one node, no cluster bootstrap checks
      xpack.security.enabled: "false"             # local development: plain HTTP, no passwords
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"
    volumes: [es-data:/usr/share/elasticsearch/data]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  metadata:
    build: { context: ., dockerfile: metadata/Dockerfile }
    image: dos/metadata:latest
    restart: unless-stopped
    environment:
      <<: [*redundancy, *database]
      ES_URL: http://elasticsearch:9200   # object metadata is also indexed here for search
      NODE_TIMEOUT: "15"            # seconds without a heartbeat (3 missed beats) before a node is FAILED
      FAILURE_CHECK_INTERVAL: "2"
    depends_on:
      pg-1: { condition: service_healthy }
    ports: ["9000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- jobs: RabbitMQ distributes repair, rebalance, gc and scrub jobs over the workers -------
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    hostname: rabbitmq                 # RabbitMQ keeps its data under its host name
    environment:
      RABBITMQ_DEFAULT_USER: dos
      RABBITMQ_DEFAULT_PASS: dos
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    ports: ["15672:15672"]             # management UI: http://127.0.0.1:15672 (dos / dos)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  repair-worker:
    build: { context: ., dockerfile: repair_worker/Dockerfile }
    image: dos/repair-worker:latest
    restart: unless-stopped
    deploy:
      replicas: 2                      # two workers share the RabbitMQ queues
    environment:
      <<: [*redundancy, *database]
      RABBITMQ_URL: "amqp://dos:dos@rabbitmq:5672/%2F?heartbeat=600&connection_attempts=10&retry_delay=3"
      WORKER_THREADS: "8"
      SCRUB_INTERVAL: "600"         # scrub every node every 10 minutes (python scripts/cli.py scrub runs it now)
      SWEEP_INTERVAL: "30"          # look for degraded chunks without a repair job
      GC_INTERVAL: "1800"           # look for orphan blobs on every node every 30 minutes
      GC_MIN_AGE: "120"             # never collect a blob written in the last 2 minutes
    depends_on:
      metadata: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---- API: two gateways behind a load balancer ----------------------------------------------
  gateway-1:
    <<: *gateway
    environment: { <<: *gateway-env, GATEWAY_ID: gateway-1 }

  gateway-2:
    <<: *gateway
    environment: { <<: *gateway-env, GATEWAY_ID: gateway-2 }

  lb:
    image: nginx:alpine
    restart: unless-stopped
    volumes: [./deploy/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ["8080:80"]                 # the public API: http://127.0.0.1:8080
    depends_on: [gateway-1, gateway-2]

  ui:
    build: ./ui
    image: dos/ui:latest
    restart: unless-stopped
    depends_on: [lb]
    ports: ["5173:80"]                 # http://127.0.0.1:5173

  # ---- monitoring -----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]               # http://127.0.0.1:9090

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # open the dashboards without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin          # log in as admin / admin to edit
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/storage.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]               # http://127.0.0.1:3000
    depends_on: [prometheus]

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  node6-data:
  node7-data:
  node8-data:
  pg-1-data:
  pg-2-data:
  es-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
