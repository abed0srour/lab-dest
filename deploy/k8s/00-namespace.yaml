apiVersion: v1
kind: Namespace
metadata:
  name: dos
---
# Settings shared by the metadata service, the gateways and the workers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dos-config
  namespace: dos
data:
  REPLICAS: "3"
  WRITE_QUORUM: "2"
  READ_QUORUM: "2"
  EC_K: "4"
  EC_M: "2"
  EC_WRITE_QUORUM: "5"
  RING_VNODES: "128"
  NODE_TIMEOUT: "15"
  DATABASE_URL: "postgresql://dos:dos@postgres:5432/dos"
  METADATA_URL: "http://metadata:8000"
  ES_URL: ""                       # no Elasticsearch in this deployment: search uses PostgreSQL
  API_KEYS: "student-key-2026:student:200,demo-key-2026:demo:5,bench-key-2026:bench:5000"
