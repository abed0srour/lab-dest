apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: dos
spec:
  selector: { app: metadata }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: dos
spec:
  replicas: 1
  selector:
    matchLabels: { app: metadata }
  template:
    metadata:
      labels: { app: metadata }
    spec:
      containers:
        - name: metadata
          image: dos/metadata:latest
          imagePullPolicy: Always   # Docker Desktop serves locally built images to Kubernetes
          envFrom: [{ configMapRef: { name: dos-config } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
