# Two gateways behind one Service: Kubernetes load-balances the requests between them.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: dos
spec:
  selector: { app: gateway }
  ports: [{ port: 8080, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: dos
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: dos/gateway:latest
          imagePullPolicy: Always   # Docker Desktop serves locally built images to Kubernetes
          envFrom: [{ configMapRef: { name: dos-config } }]
          env:
            - name: GATEWAY_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
