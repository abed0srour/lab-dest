# PostgreSQL for the metadata (one instance here; the replicated pair with failover runs in Docker
# Compose, and a cloud deployment would use a managed database or an operator).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dos
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: dos }
            - { name: POSTGRES_PASSWORD, value: dos }
            - { name: POSTGRES_DB, value: dos }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "dos", "-d", "dos"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "dos", "-d", "dos"] }
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
