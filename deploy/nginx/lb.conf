# Load balancer in front of the gateways (round robin).
# A gateway that refuses or drops a connection is taken out for 5 s and the request goes to the
# other one. "resolve" re-reads the gateways' addresses from Docker's DNS, so a restarted gateway
# (with a new IP) comes back by itself.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream gateways {
    zone gateways 64k;
    server gateway-1:8000 resolve max_fails=1 fail_timeout=5s;
    server gateway-2:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;

    # Streams uploads and downloads of any size straight through, like the gateways do.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Try the other gateway when one is down. Only for requests that are safe to repeat:
        # nginx never resends a PUT or POST whose body it has already started sending.
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream $upstream_addr always;
    }

    # Prometheus reads each gateway's metrics directly; keep them off the public entrance.
    location = /metrics {
        return 404;
    }
}
